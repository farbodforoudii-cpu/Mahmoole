html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{color-scheme:light;--bg:#F7F7F5;--card:#fff;--line:#E7E7E3;--ink:#1C1C1E;--mut:#5B5B63;--acc:#0B5D4B;--on:#fff}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#111312;--card:#1A1D1B;--line:#2A2E2C;--ink:#EDEDEA;--mut:#A3A3A8;--acc:#5FD0A8;--on:#0b1a15}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:Vazirmatn,system-ui,sans-serif;padding:24px}
form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 22px}

input[type=password]{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);direction:ltr;text-align:center;letter-spacing:1px}
label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut);margin:12px 0 16px}

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.iv)},key,b64(D.ct));const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close()}
async function derive(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.salt),iterations:D.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt'])}
(async()=>{try{const k=localStorage.getItem('mk_'+D.v);if(k){const key=await crypto.subtle.importKey('raw',b64(k),'AES-GCM',false,['decrypt']);await open_(key)}}catch(e){try{localStorage.removeItem('mk_'+D.v)}catch(_){}}})();
document.getElementById('f').addEventListener('submit',async ev=>{ev.preventDefault();const e=document.getElementById('e');e.textContent='در حال باز کردن…';
try{const key=await derive(document.getElementById('pw').value.trim());if(document.getElementById('rm').checked){const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));try{localStorage.setItem('mk_'+D.v,btoa(String.fromCharCode(...raw)))}catch(_){}}await open_(key)}catch(err){e.textContent='رمز درست نیست'}});
